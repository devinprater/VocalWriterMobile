name: VocalWriterMobile
options:
  bundleIdPrefix: org.vocalwriter.experiments
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_C_LANGUAGE_STANDARD: c11
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
    OTHER_CFLAGS:
      - "$(inherited)"
      - -ffp-contract=off
      - -fwrapv
      - -fno-fast-math
      - -Wno-unused-variable
      - -Wno-unused-parameter
      - -Wno-unused-function
      - -Wno-pointer-sign
      - -Wno-int-to-pointer-cast
      - -Wno-pointer-to-int-cast
      - -Wno-error=return-type
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/VocalWriterMobile/Engine/include"
      - "$(SRCROOT)/VocalWriterMobile/Bridge"
    SWIFT_OBJC_BRIDGING_HEADER: VocalWriterMobile/Bridge/VocalWriterMobile-Bridging-Header.h
targets:
  VocalWriterMobile:
    type: application
    platform: iOS
    sources:
      - path: VocalWriterMobile
        excludes:
          - Engine/src/vw.c
          - Resources
      - path: VocalWriterMobile/Resources/VocalWriter.dat
        buildPhase: resources
      - path: VocalWriterMobile/Resources/GMSpeech.dat
        buildPhase: resources
      - path: VocalWriterMobile/Resources/GMBank.dat
        buildPhase: resources
      - path: VocalWriterMobile/Resources/EnglishLex.dat
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vocalwriter.experiments.mobile
        PRODUCT_NAME: VocalWriterMobile
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VocalWriter
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - VocalWriterMobileTests
  VocalWriterMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocalWriterMobileTests
    dependencies:
      - target: VocalWriterMobile
